# tools/ holds the build-time Python scripts: bake_art.py (standard library), compose_atlas.py and bake_climate.py
# (Pillow, numpy), blender_species.py and preview_blender.py (Blender's bpy).
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]   # zip(strict=) adds nothing for these fixed-size tuples
